[pytest]
# La raiz de la aplicacion es backend/, que es tambien el rootdir de pytest.
testpaths = tests
python_files = test_*.py
python_functions = test_*

# La cobertura se mide sobre el codigo que sirve la API, no sobre los
# scripts de entrenamiento y recoleccion: son ejecutables one-shot que se
# validan corriendolos, y contarlos hunde el porcentaje sin decir nada
# util sobre la calidad del servicio.
addopts =
    --cov=api
    --cov=batch
    --cov=core
    --cov=database
    --cov=features
    --cov=models
    --cov=services
    --cov-report=term-missing:skip-covered
    --cov-fail-under=60

filterwarnings =
    error::DeprecationWarning:features.*
    error::DeprecationWarning:services.*

asyncio_mode = auto
