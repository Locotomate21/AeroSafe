version: '3.8'

services:
  # ============================================
  # Backend API Service
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerosafe-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./aerosafe.db}
      
      # API Keys (desde .env, SIN fallback hardcodeado por seguridad)
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      
      # ML Models - Rutas dentro del contenedor
      - MODEL_PATH=/app/models/production/model.pkl
      - SCALER_PATH=/app/models/production/scaler.pkl
      - ENCODER_PATH=/app/models/production/label_encoder.pkl
      - FEATURE_NAMES_PATH=/app/models/production/feature_names.txt
      
      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-true}
      
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/app.log
      
    volumes:
      # 🔧 IMPORTANTE: Estructura de volúmenes corregida
      
      # Backend code (hot reload en desarrollo)
      - ./backend:/app/backend
      
      # Modelos ML (CRÍTICO - estos deben existir)
      - ./models:/app/models
      
      # Data para batch processing
      - ./data:/app/data
      
      # Logs persistentes
      - ./logs:/app/logs
      
      # Scripts ML (si necesitas ejecutarlos)
      - ./ml:/app/ml
      
    networks:
      - aerosafe-network
    
    # Healthcheck para verificar que la API esté funcionando
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

